  <div class="app">
    <div class="smb-hold" hidden>
      <a id="rAbout" href="about/" data-i18n="biz.app.about">About</a>
      <button type="button" class="tb-btn" id="rCmd" data-cmd="cmd.palette" aria-label="Search commands" title="Search commands (Ctrl+K)" data-i18n-attr="aria-label:ui.cmd.search;title:biz.app.cmd_tip">⌘K</button>

      <form class="add" id="rAdd">

        <label class="field"><span data-i18n="reminders.app.time">Time</span><input id="rTime" type="time" aria-label="Time" data-i18n-attr="aria-label:reminders.app.time"></label>
        <button type="submit" class="btn primary" data-i18n="reminders.app.add">Add reminder</button>
      </form>
      <div id="rBoot" class="empty" role="status" data-i18n="reminders.app.opening">Opening your reminders…</div>
      <div id="rList"></div>
    </main>
