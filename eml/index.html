<body>
  <noscript><p class="em-noscript">Email Viewer needs JavaScript. It runs entirely in your browser, and nothing is uploaded.</p></noscript>
  <div class="em-app" id="em-app">
    <header class="em-top">
      <div class="em-brand"><span class="em-logo" aria-hidden="true"></span><h1>Email Viewer</h1></div>
      <div class="em-tools" role="toolbar" aria-label="Message">
        <button type="button" class="sui-btn sui-primary" id="em-open" title="Open .eml files from this computer (Ctrl+O)">Open</button>
        <button type="button" class="sui-btn" id="em-print" title="Print the headers and the body">Print</button>
        <button type="button" class="sui-btn" id="em-pdf" title="Save the message as a PDF">Convert to PDF</button>
        <button type="button" class="sui-btn" id="em-cmd" aria-label="Commands (search every command)">Commands</button>
        <button type="button" class="sui-btn" id="em-menu" aria-haspopup="menu">Menu</button>
      </div>
    </header>
    <div id="em-drop" class="em-dropstrip"></div>
    <nav class="em-tabs" id="em-tabs" aria-label="Open messages" hidden></nav>

    <main class="em-main" id="em-main">
      <section class="em-empty" id="em-empty">
        <h2 class="em-empty-t">Open an email file to read it.</h2>
        <p class="em-empty-s">Drop .eml files here, or open one or more from this computer. Nothing is uploaded: the file is read in this page and never leaves it.</p>
        <div class="em-empty-b">
          <button type="button" class="sui-btn sui-primary" id="em-open2">Open .eml files</button>
        </div>
      </section>

      <article class="em-msg" id="em-msg" hidden>
        <h2 class="em-subject" id="em-subject"></h2>
        <dl class="em-head" id="em-head"></dl>
        <div class="em-bar">
          <div class="em-seg" id="em-views" role="group" aria-label="Body view" hidden>
            <button type="button" class="sui-btn" id="em-v-html" aria-pressed="true">HTML</button>
            <button type="button" class="sui-btn" id="em-v-text" aria-pressed="false">Plain text</button>
          </div>
        </div>
        <div class="em-notice" id="em-notice" role="status" hidden>
          <p class="em-notice-t" id="em-notice-t"></p>
          <button type="button" class="sui-btn" id="em-cid" aria-pressed="false" hidden>Show embedded images</button>
        </div>
        <div class="em-body" id="em-body"></div>
        <details class="em-warn" id="em-warn" hidden>
          <summary>Some parts could not be read as written</summary>
          <ul id="em-warn-list"></ul>
        </details>
        <section class="em-atts" id="em-atts" aria-labelledby="em-atts-h" hidden>
          <h2 class="em-atts-h" id="em-atts-h">Attachments (<span id="em-atts-count">0</span>)</h2>
          <ul class="em-att-list" id="em-atts-list"></ul>
        </section>
      </article>
    </main>
  </div>
  <script src="../vendor/pdf-lib/pdf-lib.min.js" data-src="vendor/pdf-lib/pdf-lib.min.js"></script>
