<body>
  <div class="app">
    <header class="topbar">
      <a class="brand" href="../" title="ITpris Verktyg home" aria-label="ITpris Verktyg home" data-i18n-attr="title:img3d.app.home;aria-label:img3d.app.home"><svg viewBox="0 0 32 32" class="brand-mark" aria-hidden="true"><path d="M16 2C16 2 6 13.5 6 20a10 10 0 0 0 20 0C26 13.5 16 2 16 2z"/></svg></a>
      <span class="appname"><b data-app-name="img3d">Image to 3D</b></span>
      <div class="actions">
        <button type="button" class="tb-btn" id="btnOpen" title="Open a picture from disk" data-i18n-attr="title:img3d.app.open_tip" data-i18n="img3d.app.open">Open image…</button>
        <button type="button" class="tb-btn" id="btnDrive" data-i18n="img3d.app.drive">From Files…</button>
      </div>
    </header>
    <!-- View · Panel (shared/frame): the 3D view, and the settings with Open in 3D Modeller at the panel's foot on the right -->
    <div class="work" id="work">
      <aside class="panel" id="panel" aria-label="Settings" data-i18n-attr="aria-label:img3d.app.settings">
        <section class="i3-group" data-title="Picture" data-key="img3d.group.picture">
          <p class="meta" id="picName">No picture yet. Open one, drop one here, or take one from Files.</p>
        </section>
        <section class="i3-group" data-title="Depth" data-key="img3d.group.depth">
          <p class="meta" id="depthNote"></p>
          <label class="row"><input type="checkbox" id="invert"> <span data-i18n="img3d.depth.invert">Invert depth (far becomes near)</span></label>
          <button type="button" class="sui-btn i3-more" id="btnMore" data-i18n="img3d.depth.more">Get more…</button>
        </section>
        <section class="i3-group" data-title="Subject" data-key="img3d.group.subject">
          <label class="row"><input type="checkbox" id="subject"> <span data-i18n="img3d.subject.only">Subject only (remove the background)</span></label>
          <p class="meta" id="subjectNote" data-i18n="img3d.subject.note">Uses the background remover (Background Remover's Quality model, runs on your device).</p>
        </section>
        <section class="i3-group" data-title="Output" data-key="img3d.group.output">
          <label class="row"><span data-i18n="img3d.out.show_as">Show as</span>
            <select id="mode">
              <option value="mesh" data-i18n="img3d.out.mesh">Height-field mesh</option>
              <option value="points" data-i18n="img3d.out.points">Point cloud</option>
              <option value="splats" data-i18n="img3d.out.splats">Splats</option>
            </select>
          </label>
          <label class="row"><span data-i18n="img3d.out.resolution">Resolution</span>
            <select id="grid">
              <option value="64">64</option><option value="128" selected>128</option><option value="192">192</option><option value="256">256</option>
            </select>
          </label>
          <label class="row"><span data-i18n="img3d.out.scale">Depth scale</span> <output id="scaleVal">0.30</output>
            <input type="range" id="scale" min="0" max="1" step="0.01" value="0.3"></label>
          <label class="row"><span data-i18n="img3d.out.smoothing">Smoothing</span> <output id="smoothVal">2</output>
            <input type="range" id="smooth" min="0" max="8" step="1" value="2"></label>
          <label class="row"><span data-i18n="img3d.out.size">Point size</span> <output id="sizeVal">1.0</output>
            <input type="range" id="size" min="0.3" max="3" step="0.1" value="1"></label>
        </section>
        <button type="button" class="tb-btn" id="btnObj" disabled data-i18n="img3d.btn.obj">Export OBJ</button>
        <button type="button" class="tb-btn" id="btnGlb" disabled data-i18n="img3d.btn.glb">Export GLB</button>
        <button type="button" class="btn primary" id="btnSend" disabled data-i18n="img3d.btn.send">Open in 3D Modeller</button>
        <section class="i3-group" data-title="Controls" data-key="img3d.group.controls">
          <p class="meta" data-i18n="img3d.controls.help">Drag to orbit. Right-drag or Shift-drag to pan. Wheel to zoom. Double-click to frame.</p>
        </section>
      </aside>
      <main class="stage" id="stage">
        <div id="vp" class="vp"><p class="hint" id="hint" data-i18n="img3d.stage.hint">Drop a picture here, or open one.</p></div>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </main>
    </div>
