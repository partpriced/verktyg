<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Spreadsheets saved place</title>
  <style>body { margin: 0; background: #111; } iframe { width: 1280px; height: 760px; border: 0; display: block; }</style>
</head>
<body>
  <iframe id="app" src="about:blank"></iframe>
  <script src="../harness.js"></script>
  <script>
  const { describe, it, expect, waitFor, sleep, run } = TlbxTest;
  const f = document.getElementById('app');
  /** Load a page in the iframe; for Spreadsheets, wait until the workbook has launched (TlbxTables.ready). */
  async function open(src) {
    const want = new URL(src, location.href).pathname, app = src.includes('tables');
    f.src = src;
    await waitFor(() => f.contentWindow && f.contentWindow.location.pathname === want && f.contentWindow.document.readyState === 'complete' && (!app || (f.contentWindow.TlbxTables && f.contentWindow.TlbxTables.ready)), { timeout: 30000 });
    return f.contentWindow;
  }

  describe('Spreadsheets saved place', () => {
    it('comes back to the same active cell after leaving for Files', async () => {
      await new Promise((res) => { const q = indexedDB.deleteDatabase('tlbx-tables-drafts'); q.onsuccess = q.onerror = q.onblocked = () => res(); });
      let W = await open('../../tables/index.html');
      const S = W.TlbxTables.S;
      S.sel = { r: 3, c: 2, er: 3, ec: 2 };
      W.document.body.click(); // a user gesture: the place is saved on input
      await sleep(600);
      W.TlbxGuard && W.TlbxGuard.setUnsaved('tables', false); // the leave-page prompt would hold the navigation
      await open('../drive/frame.html');
      await sleep(60);
      W = await open('../../tables/index.html');
      expect(JSON.stringify(W.TlbxTables.S.sel)).toBe(JSON.stringify({ r: 3, c: 2, er: 3, ec: 2 }));
    }, { timeout: 90000 });
  });
  run({ name: 'Spreadsheets · saved place' });
  </script>
</body>
</html>
