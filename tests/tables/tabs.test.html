<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Spreadsheets tabs</title>
  <style>body { margin: 0; background: #111; } iframe { width: 1280px; height: 760px; border: 0; display: block; }</style>
</head>
<body>
  <iframe id="app" src="about:blank"></iframe>
  <script src="../harness.js"></script>
  <script>
  const { describe, it, expect, waitFor, sleep, run } = TlbxTest;
  const f = document.getElementById('app');
  const W = () => f.contentWindow;
  const tabEls = () => [...W().document.querySelectorAll('#doc-tabs .sl-doctab')];

  /** Load the app fresh (about:blank first, so a reload never reads the old page's ready flag). */
  async function open() {
    f.src = 'about:blank';
    await waitFor(() => f.contentWindow && f.contentWindow.location.href === 'about:blank', { timeout: 5000 });
    f.src = '../../tables/index.html';
    await waitFor(() => f.contentWindow && f.contentWindow.TlbxTables && f.contentWindow.TlbxTables.ready, { timeout: 30000 });
    return W();
  }

  describe('Spreadsheets tabs', () => {
    it('two workbook tabs switch, and a reload brings both back with their cells', async () => {
      // A clean start: no tabs stored from an earlier run of this page. Records are cleared, not the database,
      // because a live frame still holds it open.
      localStorage.removeItem('tlbx.doctabs.tables.v1');
      await new Promise((res) => {
        const r = indexedDB.open('tlbx-doctabs', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('docs');
        r.onerror = r.onblocked = () => res();
        r.onsuccess = () => { const d = r.result; const tx = d.transaction('docs', 'readwrite'); tx.objectStore('docs').clear(); tx.oncomplete = tx.onerror = tx.onabort = () => { d.close(); res(); }; };
      });
      let w = await open();
      w.TlbxTables.setCell('A1', 'first');
      w.TlbxTables.command('file.new'); // a new workbook in a second tab
      await waitFor(() => tabEls().length === 2, { timeout: 5000 });
      expect(w.TlbxTables.value('A1')).toBe(null);
      w.TlbxTables.setCell('A1', 'second');
      tabEls()[0].click(); // switch back to the first workbook
      expect(w.TlbxTables.value('A1')).toBe('first');
      expect(tabEls()[0].getAttribute('aria-selected')).toBe('true');
      await w.TlbxTables.flushTabs();

      // Reload: both tabs, the first workbook on screen.
      w = await open();
      await waitFor(() => tabEls().length === 2, { timeout: 5000 });
      expect(w.TlbxTables.value('A1')).toBe('first');
      tabEls()[1].click();
      expect(w.TlbxTables.value('A1')).toBe('second');
      tabEls()[0].click();
      expect(w.TlbxTables.value('A1')).toBe('first');
    }, { timeout: 90000 });
  });
  run({ name: 'Spreadsheets tabs' });
  </script>
</body>
</html>
