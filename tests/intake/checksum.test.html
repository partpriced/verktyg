<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Shared intake in Checksum: every way in is the same path</title>
  <style>body { margin: 0; } iframe { width: 1000px; height: 700px; border: 0; display: block; }</style>
</head>
<body>
<iframe id="app"></iframe>
<script src="../harness.js"></script>
<script>
  // Covers: checksum/js/checksum.js
  // Checksum on the one intake: a click on the box (the picker), a drop on it and a paste reach the same reader,
  // which hashes the file.
  const { describe, it, expect, waitFor, run } = TlbxTest;
  let W, D, seen = [];
  const dtOf = (files) => { const dt = new W.DataTransfer(); files.forEach((f) => dt.items.add(f)); return dt; };
  const file = (name) => new W.File(['abc'], name, { type: 'text/plain' });
  const SHA256_ABC = 'ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad';
  async function through(source, start) {
    seen = [];
    D.getElementById('ck-result') && (D.getElementById('ck-result').textContent = '');
    await start();
    await waitFor(() => seen.length && D.body.textContent.includes(SHA256_ABC), { timeout: 15000 });
    expect(seen).toEqual([source]);
  }
  describe('Checksum: one way in', () => {
    it('a click on the box', async () => {
      const fr = document.getElementById('app');
      fr.src = '../../checksum/index.html?alg=sha256';
      await waitFor(() => { try { return fr.contentWindow.TlbxChecksum && fr.contentWindow.TlbxIntake.spec('checksum'); } catch (e) { return false; } }, { timeout: 20000 });
      W = fr.contentWindow; D = W.document;
      const s = W.TlbxIntake.spec('checksum'), reader = s.process;
      s.process = (f, ctx) => { seen.push(ctx.source); return reader(f, ctx); };
      W.TlbxUI = Object.assign(W.TlbxUI || {}, { pickFiles: async () => [file('a.txt')] });
      await through('picker', () => D.getElementById('ck-drop').click());
    }, { timeout: 40000 });
    it('a drop on the box', async () => {
      await through('drop', () => D.getElementById('ck-drop').dispatchEvent(new W.DragEvent('drop', { bubbles: true, cancelable: true, dataTransfer: dtOf([file('b.txt')]) })));
    });
    it('a paste', async () => {
      await through('paste', () => D.body.dispatchEvent(new W.ClipboardEvent('paste', { bubbles: true, cancelable: true, clipboardData: dtOf([file('c.txt')]) })));
    });
  });
  run({ name: 'Shared intake: Checksum' });
</script>
</body>
</html>
