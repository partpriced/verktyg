<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Shared intake in Video Remix: every way in is the same path</title>
  <style>body { margin: 0; } iframe { width: 1280px; height: 800px; border: 0; display: block; }</style>
</head>
<body>
<iframe id="app"></iframe>
<script src="../harness.js"></script>
<script>
  // Covers: remix/js/intake.js, remix/js/ui.js, remix/js/drop.js, remix/js/send.js, remix/js/config.js
  // Video Remix on the one intake: a drop on the bin, the zone's Choose files, Add files…, a paste and ?drive=<id>
  // (launch, new) reach the same reader with the same events; the music file is a part of its own. Send to Video Editor goes
  // out through TlbxOuttake.send with the manifest's Drive id.
  const { describe, it, expect, waitFor, run } = TlbxTest;
  let W, D, seen = [], events = [];
  const dtOf = (files) => { const dt = new W.DataTransfer(); files.forEach((f) => dt.items.add(f)); return dt; };
  async function png(name) {
    const c = D.createElement('canvas'); c.width = 64; c.height = 36; c.getContext('2d').fillRect(0, 0, 64, 36);
    return new W.File([await new Promise((r) => c.toBlob(r, 'image/png'))], name, { type: 'image/png' });
  }
  async function through(source, start, app = 'remix') {
    seen = []; events = [];
    await start();
    await waitFor(() => events.some((e) => e[0] === 'after'), { timeout: 15000 });
    if (app === 'remix') expect(seen).toEqual([source]);
    expect(events.map((e) => e[0])).toEqual(['before', 'file', 'after']);
    expect(events.every((e) => e[1] === app && e[2] === source)).toBe(true);
  }
  const count = () => W.RM.state.items.length;

  describe('Video Remix: one way in', () => {
    it('a drop on the bin', async () => {
      const fr = document.getElementById('app');
      fr.src = '../../remix/index.html';
      await waitFor(() => { try { return fr.contentWindow.RM.ready && fr.contentWindow.TlbxIntake.spec('remix'); } catch (e) { return false; } }, { timeout: 20000 });
      W = fr.contentWindow; D = W.document;
      const s = W.TlbxIntake.spec('remix'), reader = s.process;
      s.process = (f, ctx) => { seen.push(ctx.source); return reader(f, ctx); };
      for (const t of ['before', 'file', 'after']) W.TlbxIntake.on(t, (d) => { events.push([t, d.app, d.source]); });
      const n = count();
      await through('drop', async () => D.getElementById('rm-bin').dispatchEvent(new W.DragEvent('drop', { bubbles: true, cancelable: true, dataTransfer: dtOf([await png('a.png')]) })));
      expect(count()).toBe(n + 1);
    }, { timeout: 40000 });
    it("the zone's Choose files", async () => {
      const f = await png('b.png');
      await through('picker', () => { const i = D.querySelector('#rm-drop input[type=file]'); i.files = dtOf([f]).files; i.dispatchEvent(new W.Event('change')); });
    });
    it('a paste', async () => {
      const f = await png('c.png');
      await through('paste', () => D.body.dispatchEvent(new W.ClipboardEvent('paste', { bubbles: true, cancelable: true, clipboardData: dtOf([f]) })));
    });
    it('?drive=<id> from another app (launch)', async () => {
      const blob = await png('sent.png');
      W.TlbxHub.consumeLaunch = async () => ({ id: 'x1', name: 'sent.png', type: 'image/png', blob });
      await through('launch', () => W.TlbxIntake.launch({ to: 'remix' }));
    });
    it('Pick music file is a part of its own', async () => {
      W.TlbxUI.pickFiles = async () => [new W.File([new Uint8Array(100)], 'song.mp3', { type: 'audio/mpeg' })];
      seen = [];
      await through('picker', () => D.getElementById('rm-music').click(), 'remix.music');
      expect(seen).toEqual([]);
    });
  });
  describe('Video Remix: one way out', () => {
    it('Send to Video Editor is TlbxOuttake.send with the manifest id', async () => {
      let sent = null;
      W.TlbxOuttake.send = async (to, o) => { sent = [to, o.from, !!o.id]; };
      await W.RM.sendToVideoStudio();
      expect(sent).toEqual(['videoedit', 'remix', true]);
    });
  });
  run({ name: 'Shared intake: Video Remix' });
</script>
</body>
</html>
