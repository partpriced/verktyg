<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Inventory saved place</title>
  <style>body { margin: 0; background: #111; } iframe { width: 1280px; height: 760px; border: 0; display: block; }</style>
</head>
<body>
  <iframe id="app" src="about:blank"></iframe>
  <script src="../harness.js"></script>
  <script>
  const { describe, it, expect, waitFor, sleep, run } = TlbxTest;
  const f = document.getElementById('app');
  /** Load a page in the iframe; for Inventory, wait until the store has opened (the boot cover is hidden). */
  async function open(src) {
    const want = new URL(src, location.href).pathname, app = src.includes('inventory');
    f.src = src;
    await waitFor(() => f.contentWindow && f.contentWindow.location.pathname === want && f.contentWindow.document.readyState === 'complete' && (!app || (f.contentWindow.TlbxInv && f.contentWindow.TlbxInv.state && f.contentWindow.document.getElementById('boot').hidden)), { timeout: 30000 });
    return f.contentWindow;
  }

  describe('Inventory saved place', () => {
    it('comes back to the same view and product search after leaving for Files', async () => {
      await new Promise((res) => { const q = indexedDB.deleteDatabase('tlbx-session'); q.onsuccess = q.onerror = q.onblocked = () => res(); });
      let W = await open('../../inventory/index.html');
      W.TlbxInv.app.show('reports');
      const search = W.document.getElementById('pSearch');
      search.value = 'widget';
      search.dispatchEvent(new W.Event('input', { bubbles: true }));
      await sleep(600);
      await open('../drive/frame.html');
      await sleep(60);
      W = await open('../../inventory/index.html');
      expect(W.TlbxInv.state.view).toBe('reports');
      expect(W.document.getElementById('pSearch').value).toBe('widget');
    }, { timeout: 90000 });
  });
  run({ name: 'Inventory · saved place' });
  </script>
</body>
</html>
