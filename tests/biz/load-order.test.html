<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Business · TlbxBiz keeps what loaded before it</title>
  <!-- Covers: shared/biz/biz.js -->
</head>
<body>
  <script src="../harness.js"></script>
  <script src="../../shared/biz/setup.js"></script>
  <script src="../../shared/biz/router.js"></script>
  <script src="../../shared/biz/biz.js"></script>
  <script>
  // biz.js used to replace window.TlbxBiz, so setup.js or router.js loaded before it were lost (Admin loads them first).
  const { describe, it, expect, run } = TlbxTest;
  describe('TlbxBiz load order', () => {
    it('biz.js merges into TlbxBiz: the parts that loaded before it are still there', () => {
      expect(typeof window.TlbxBiz.setup.steps).toBe('function');
      expect(typeof window.TlbxBiz.router.start).toBe('function');
      expect(typeof window.TlbxBiz.refusal).toBe('function');
    });
  });
  run();
  </script>
</body>
</html>
