<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Image to 3D assistant commands</title>
  <style>body { margin: 0; background: #111; } iframe { width: 1200px; height: 760px; border: 0; display: block; }</style>
</head>
<body>
  <!-- The real page in an iframe. The depth model is marked as removed, so nothing is downloaded and brightness is the depth. -->
  <script>try { localStorage.setItem('tlbx-firstrun:img3d', '1'); localStorage.setItem('tlbx-img3d:depth-had', '1'); } catch (e) { /* private window */ }</script>
  <script src="../harness.js"></script>
  <script src="../../shared/commands/args.js"></script>
  <script>
  // Covers: img3d/js/app/ai-commands.js, img3d/js/app/main.js, shared/commands/sources.js
  const { describe, it, expect, waitFor } = TlbxTest;
  let W, C;
  const run = async (id, args) => { const r = await C.exec('img3d.ai.' + id, args); if (!r.ok) throw new Error(id + ': ' + r.error); return r; };
  const driveId = (r) => /id ([^)\s]+)\)/.exec(r.value)[1];
  function picture() {
    const c = document.createElement('canvas'); c.width = 64; c.height = 48;
    const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 64, 48);
    gr.addColorStop(0, '#202020'); gr.addColorStop(1, '#e0e0e0'); g.fillStyle = gr; g.fillRect(0, 0, 64, 48);
    return new Promise((res) => c.toBlob(res, 'image/png'));
  }

  describe('Image to 3D assistant commands', () => {
    it('prepare() loads the commands; new_from_picture makes a mesh from a Files picture', async () => {
      const f = document.createElement('iframe');
      f.src = '../../img3d/index.html';
      document.body.append(f);
      await waitFor(() => f.contentWindow && f.contentWindow.TlbxImg3D && f.contentWindow.TlbxImg3D.app && f.contentWindow.TlbxCmd, { timeout: 20000 });
      W = f.contentWindow; C = W.TlbxCmd;
      await C.prepare();
      for (const t of ['new-from-picture', 'set-options', 'export-model']) expect(!!C.get('img3d.ai.' + t)).toBe(true);
      expect(TlbxCmdArgs.jsonSchema(C.get('img3d.ai.set-options').args).properties.mode.enum).toEqual(['mesh', 'points', 'splats']);
      await W.TlbxHub.put(await picture(), { name: 'ramp.png' });
      const r = await run('new-from-picture', { file: 'ramp.png' });
      expect(r.value).toMatch(/mesh from ramp/);
      expect(C.state().open).toMatch(/brightness/);
    }, { timeout: 60000 });

    it('set_options switches to points and back; the checkpoint restores the options', async () => {
      const back = C.checkpoint();
      const r = await run('set-options', { mode: 'points', scale: 0.6, invert: true });
      expect(r.value).toMatch(/^Now points/);
      expect(W.TlbxImg3D.app.state().item.kind).toBe('points');
      expect(W.document.getElementById('scale').value).toBe('0.6');
      back();
      expect(W.document.getElementById('mode').value).toBe('mesh');
      expect(W.document.getElementById('invert').checked).toBe(false);
      await waitFor(() => W.TlbxImg3D.app.idle() && W.TlbxImg3D.app.state().item.kind === 'mesh', { timeout: 20000 });
    }, { timeout: 40000 });

    it('export_model: GLB, OBJ and a 3D Modeller scene to Files, read back', async () => {
      const g = await run('export-model', { format: 'glb' });
      const b = new Uint8Array(await (await W.TlbxHub.get(driveId(g))).blob.arrayBuffer());
      expect(new TextDecoder().decode(b.slice(0, 4))).toBe('glTF');
      const o = await run('export-model', { format: 'obj' });
      expect(await (await W.TlbxHub.get(driveId(o))).blob.text()).toMatch(/\nv [-\d.]+ [-\d.]+ [-\d.]+/);
      const s = await run('export-model', { format: 's3d' });
      const scene = JSON.parse(await (await W.TlbxHub.get(driveId(s))).blob.text());
      expect(scene.format).toBe('tlbx-3d');
      expect(Object.values(scene.nodes).some((n) => n.type === 'mesh')).toBe(true);
    }, { timeout: 60000 });
  });
  TlbxTest.run({ name: 'Image to 3D assistant commands' });
  </script>
</body>
</html>
