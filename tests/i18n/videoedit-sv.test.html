<head>
  <meta charset="utf-8">
  <title>Video Editor in Swedish</title>

       shared/tour/tours/videostudio.js -->
  <style>body { margin: 0; background: #111; color: #eee; font: 12px system-ui; } iframe { width: 1280px; height: 800px; border: 0; display: block; }</style>
</head>
<body>
  <script src="../harness.js"></script>
  <script>
  const { describe, it, beforeEach, afterEach, expect, waitFor, run } = TlbxTest;
  // The app in a same-origin iframe, so it shares this page's localStorage (the language choice).
  const frames = [];
  function open(lang, width = 1280) {
    if (lang) localStorage.setItem('tlbx-profile', JSON.stringify({ v: 1, data: { lang: { mode: lang } } }));
    const f = document.createElement('iframe');
    f.style.width = width + 'px';
    f.src = '../../videostudio/index.html';
    document.body.append(f);
    frames.push(f);
    return waitFor(() => f.contentDocument && f.contentDocument.readyState === 'complete' && (f.contentDocument.body.classList.contains('ready')) && f.contentWindow.TlbxShell && f.contentWindow.TlbxShell.currentApp, { timeout: 30000 }).then(() => f);
  }
  const KEY = /(^|[\s(“"'«])(videoedit|ui|menu|shell|nav)\.[a-z0-9_]+\.?[a-z0-9_.]*[a-z0-9_]/;
  /** Text a person sees or hears in the page: the body text, the labelling attributes and the options. */
  function visible(doc) {
    const out = [doc.body.innerText];
    for (const el of doc.querySelectorAll('[title], [aria-label], [placeholder]')) out.push(el.getAttribute('title') || '', el.getAttribute('aria-label') || '', el.getAttribute('placeholder') || '');
    for (const o of doc.querySelectorAll('option')) out.push(o.textContent);
    return out.join('\n');
  }
  const txt = (doc, sel) => doc.querySelector(sel).textContent.trim();
  /** The tour's words, read the way TlbxTour reads them: keys <ns>.tour.title, <ns>.tour.<step>_title in the app tables. */
  function tour(f) {
    const w = f.contentWindow, got = [], keep = w.TlbxTour;
    w.TlbxTour = { define: (t) => got.push(t) };
    return new Promise((res, rej) => {
      const s = f.contentDocument.createElement('script');
      s.src = '../shared/tour/tours/videostudio.js';
      s.onload = () => { w.TlbxTour = keep; const d = got[0], say = (k) => w.TlbxI18n.t((d.ns || d.app) + '.tour.' + k); res({ title: say('title'), steps: d.steps.map((x) => ({ title: say(x.id.replace(/-/g, '_') + '_title') })) }); };
      s.onerror = rej;
      f.contentDocument.head.append(s);
    });
  }

  describe('Video Editor in Swedish', () => {
    beforeEach(() => { localStorage.clear(); });
    afterEach(() => { frames.splice(0).forEach((f) => f.remove()); localStorage.clear(); });
    const menus = (doc) => [...doc.querySelectorAll('#menus .menu-b')].map((b) => b.textContent.trim());
    const tabs = (doc) => [...doc.querySelectorAll('#mtabs .mtab span')].map((s) => s.textContent.trim());

    it('shows Swedish menus, tabs, bin, timeline tools and palette titles, with no key showing', async () => {
      const f = await open('sv');
      const doc = f.contentDocument, w = f.contentWindow;
      expect(doc.documentElement.getAttribute('lang')).toBe('sv');
      expect(menus(doc)).toEqual(['Arkiv', 'Redigera', 'Klipp', 'Sekvens', 'Visa', 'Layout', 'Hjälp']);
      expect(tabs(doc)).toEqual(['Media', 'Effekter', 'Granskare', 'Tidslinje']);
      expect(txt(doc, '#statusLeft')).toBe('Klar');
      expect(doc.querySelector('#bin').textContent).toContain('Importera filer');
      expect(w.TlbxCmd.get('edit.split').title).toBe('Dela vid uppspelningshuvudet');
      expect(w.TlbxCmd.get('tr.cross').title).toBe('Lägg till övergång: Övertoning');
      expect(doc.querySelector('#tlBar [data-cmd="edit.split"]').getAttribute('aria-label')).toBe('Dela vid uppspelningshuvudet');
      const t = await tour(f);
      expect(t.title).toBe('Rundtur i Video Editor');
      expect(t.steps[0].title).toBe('Mediebibliotek');
      expect(KEY.test(visible(doc))).toBe(false);
    });

    it('switching to English live switches back, then Swedish again', async () => {
      const f = await open('sv');
      const doc = f.contentDocument, w = f.contentWindow, I = w.TlbxI18n;
      I.set('en');
      await waitFor(() => menus(doc)[0] === 'File' && w.TlbxCmd.get('edit.split').title === 'Split at playhead', { timeout: 20000 });
      expect(doc.documentElement.getAttribute('lang')).toBe('en');
      expect(tabs(doc)).toEqual(['Media', 'Effects', 'Inspector', 'Timeline']);
      expect(doc.querySelector('#bin').textContent).toContain('Import files');
      expect(w.TlbxCmd.get('tr.cross').title).toBe('Add transition: Cross dissolve');
      I.set('sv');
      await waitFor(() => menus(doc)[0] === 'Arkiv' && doc.querySelector('#bin').textContent.includes('Importera filer'), { timeout: 20000 });
      expect(KEY.test(visible(doc))).toBe(false);
    });

    it('the offline copy carries the English tables, read before anything is fetched', async () => {
      const f = await open('sv');
      const html = await f.contentWindow.SE.build.make();
      expect(html.indexOf('name="videoedit-build" content="offline"') < html.indexOf('data-src="shared/i18n/i18n.js"')).toBe(true);
      for (const p of ['shared/i18n/ui/en.js', 'videostudio/i18n/en/ui1.js', 'videostudio/i18n/en/defs.js']) expect(html).toContain('data-src="' + p + '"');
    });

    it('at 390 px Swedish fits with no sideways scroll', async () => {
      const f = await open('sv', 390);
      const doc = f.contentDocument;
      await waitFor(() => doc.documentElement.getAttribute('lang') === 'sv', { timeout: 20000 });
      expect(doc.documentElement.scrollWidth <= f.contentWindow.innerWidth + 1).toBe(true);
      expect(KEY.test(visible(doc))).toBe(false);
    });
  });
  run({ name: 'Video Editor in Swedish' });
  </script>
</body>
</html>
