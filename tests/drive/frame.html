<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Files test frame</title>
  <!-- A bare page with the shared kit, for the Drive model, picker, backup and guard tests.
       ?db=<name> picks the Files database; ?foreign=1 gives the page its own window.TlbxUI (like the homepage). -->
  <script src="../../shared/i18n/i18n.js"></script>   <!-- the shared components' words (shared/i18n/ui) -->
  <script>
    var q = new URLSearchParams(location.search);
    if (q.get('db')) window.TLBX_DRIVE_DB = q.get('db');
    if (q.get('foreign')) window.TlbxUI = { randSeed: function () { return 1; } };
  </script>
  <script src="../../shared/apps.js"></script>
  <script>if (!new URLSearchParams(location.search).get('foreign')) document.write('<link rel="stylesheet" href="../../shared/tlbxui.css"><script src="../../shared/tlbxui.js"><\/script>');</script>
  <script src="../../shared/hub.js"></script>
  <script src="../../shared/intake/outtake.js"></script>
  <script src="../../shared/ops/entry.js"></script>
  <script src="../../shared/guard.js" defer></script>
</head>
<body><p>Files test frame</p></body>
</html>
