<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Assistant: one task through several apps in one tab (stay here / show me), fake engine</title>
<style>body { margin: 0; background: #111; } iframe { width: 1280px; height: 800px; border: 0; display: block; }</style></head>
<body>
  <script src="../harness.js"></script>
  <script>
  // Covers: shared/ai/handoff.js, shared/ai/panel-run.js, shared/ai/panel.js, shared/ai/apptools.js, shared/ai/optools.js,
  //   shared/hub.js, shared/intake/outtake.js, shell/header.js
  // Real pages in one frame: Files → (Background Remover →) Image Editor. The test puts a fake engine into each page as it
  // arrives (a real person's provider comes back by itself); the task, the chat and the chain travel in sessionStorage.
  const { describe, it, expect, waitFor, sleep } = TlbxTest;
  const call = (name, args) => `<tool_call>{"name": "${name}", "arguments": ${JSON.stringify(args)}}</tool_call>`;
  let frame;
  const W = () => frame.contentWindow;
  function wipe() {
    for (const k of Object.keys(localStorage)) if (/^tlbx-ai\.|^tlbx-firstrun:ai-cloud/.test(k)) localStorage.removeItem(k);
    for (const k of Object.keys(sessionStorage)) if (/^tlbx-ai\./.test(k)) sessionStorage.removeItem(k);
    for (const [k, v] of [['tlbx-firstrun:aitools', '1'], ['tlbx-firstrun:bgremover', '1'], ['imageeditor.tourShown', '1'], ['tlbx-cutout.model', '"fast"'],
      ['tlbx.consent', JSON.stringify({ v: 1, analytics: false, ads: false, t: 1 })]]) localStorage.setItem(k, v);
  }
  async function open(path) {
    if (frame) frame.remove();
    frame = document.createElement('iframe'); frame.src = '../../' + path; document.body.append(frame);
    await waitFor(() => W().document && W().document.body && W().document.body.classList.contains('ready') && W().TlbxHub, { timeout: 30000 });
    return W();
  }
  /** The frame moved on its own to an app's page: its panel is open again with the chat that came along. */
  async function arrived(dir) {
    await waitFor(() => { try { return W().location.pathname.includes('/' + dir + '/') && W().document.readyState === 'complete' && W().TlbxAIPanel && W().TlbxAIPanel.isOpen; } catch (e) { return false; } }, { timeout: 60000 })
      .catch(() => { const w = W(); throw new Error(`not in ${dir}: at ${w.location.pathname}${w.location.search}, ready ${w.document.body && w.document.body.classList.contains('ready')}, panel ${!!w.TlbxAIPanel} open ${!!(w.TlbxAIPanel && w.TlbxAIPanel.isOpen)}, record ${sessionStorage.getItem('tlbx-ai.handoff')}, chat: ${w.document.querySelector('.sap-list') ? w.document.querySelector('.sap-list').textContent.slice(-600) : '-'} dialogs: ${[...w.document.querySelectorAll('.sui-dlg')].map((d) => d.textContent.slice(0, 200)).join(' | ')}`); });
    await W().TlbxAIPanel.ready;
    return W();
  }
  async function engine(w, replies) {
    const e = new w.TlbxAIKit.FakeEngine({ delay: 0, loadMs: 0, replies }); await e.load('fake');
    w.TlbxAIPanel.use(e);
    return e;
  }
  const text = (w) => w.document.querySelector('.sap-list').textContent;
  /** A photo: a red disc on stripes, as a JPEG in Files. */
  async function photo(w) {
    const c = w.document.createElement('canvas'); c.width = 320; c.height = 240;
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, 320, 240);
    g.fillStyle = '#222'; for (let x = 0; x < 320; x += 10) g.fillRect(x, 0, 5, 240);
    g.fillStyle = '#e22'; g.beginPath(); g.arc(160, 120, 70, 0, Math.PI * 2); g.fill();
    await w.TlbxHub.put(await new Promise((r) => c.toBlob(r, 'image/jpeg', 0.9)), { name: 'chain-photo.jpg', from: 'test' });
  }
  /** Remove background without the model: the disc is the subject. */
  function stubCutout(w) {
    w.VideoStudioout = { removeBackground: async (file) => {
      const bmp = await w.createImageBitmap(file), c = w.document.createElement('canvas'); c.width = bmp.width; c.height = bmp.height;
      const g = c.getContext('2d'); g.beginPath(); g.arc(160, 120, 70, 0, Math.PI * 2); g.clip(); g.drawImage(bmp, 0, 0);
      const mask = new Uint8ClampedArray(bmp.width * bmp.height);
      for (let y = 0; y < bmp.height; y++) for (let x = 0; x < bmp.width; x++) if (Math.hypot(x - 160, y - 120) <= 70) mask[y * bmp.width + x] = 255;
      return { cutout: g.getImageData(0, 0, bmp.width, bmp.height), mask, width: bmp.width, height: bmp.height };
    } };
  }

  describe('"Stay on this page when possible" (the default)', () => {
    it('cut-out runs here (run_operation), then the task moves to Image Editor with the result for the text', async () => {
      wipe();
      let w = await open('drive/');
      await photo(w); stubCutout(w);
      await w.TlbxHeader.openAI(); await w.TlbxAIPanel.ready;
      const e = await engine(w, [call('run_operation', { operation: 'bgremover.remove-bg', files: ['chain-photo.jpg'] }),
        call('open_in_app', { app: 'imageeditor', files: ['chain-photo.png'], task: 'Add the word SALE at the top of chain-photo.png' })]);
      w.TlbxAIPanel.send('cut out my photo chain-photo.jpg and add the text SALE');
      await waitFor(() => e.calls.length >= 1);
      const sys = e.calls[0].messages[0].content;
      expect(sys).toContain('Stay on this page when possible'); expect(sys).toContain('open_in_app(app');
      w = await arrived('imageeditor');
      expect(text(w)).toContain('cut out my photo chain-photo.jpg');
      expect(text(w)).toContain('Opening Image Editor…'); expect(text(w)).toContain('Continuing in Image Editor with chain-photo.png.');
      const chain = JSON.parse(JSON.stringify(w.TlbxAIKit.panel.chain));
      expect(chain.hop).toBe(1);
      await waitFor(() => w.eval('typeof D !== "undefined" && D && D.w === 320'), { timeout: 20000 });
      const e2 = await engine(w, [call('add_text', { text: 'SALE', position: 'top', size: 40 }), 'Added SALE at the top.']);
      await waitFor(() => /Added SALE at the top\./.test(text(w)), { timeout: 20000 });
      expect(e2.calls[0].messages.find((m) => m.role === 'user').content).toContain('cut out my photo');
      expect(w.eval('D.layers.some((l) => l.text && l.text.str === "SALE")')).toBe(true);
      expect(w.location.pathname).toContain('/imageeditor/');
    }, { timeout: 120000 });
  });

  describe('"Show me in each app"', () => {
    it('Files → Background Remover (the cut-out happens there) → Image Editor as a layer with its mask → text and export', async () => {
      wipe(); localStorage.setItem('tlbx-ai.hops', 'show');
      let w = await open('drive/');
      await photo(w);
      await w.TlbxHeader.openAI(); await w.TlbxAIPanel.ready;
      const e = await engine(w, [call('open_in_app', { app: 'cutout', files: ['chain-photo.jpg'], task: 'Remove the background, then take the cut-out to Image Editor, add SALE at the top and export a PNG' })]);
      w.TlbxAIPanel.send('show me: cut out chain-photo.jpg, put SALE on it and export it');
      await waitFor(() => e.calls.length >= 1);
      expect(e.calls[0].messages[0].content).toContain('Show me in each app');
      w = await arrived('bgremover');
      expect(text(w)).toContain('Continuing in Background Remover with chain-photo.jpg.');
      await waitFor(() => w.CO && w.CO.state.items.length && w.CO.state.items[0].status === 'done', { timeout: 90000 });
      await engine(w, [call('open_in_app', { app: 'imageeditor', files: ['open'], task: 'Add SALE at the top and export a PNG' })]);
      w = await arrived('imageeditor');
      expect(text(w)).toMatch(/Continuing in Image Editor with chain-photo.*\.png\./);
      expect(JSON.parse(JSON.stringify(w.TlbxAIKit.panel.chain)).hop).toBe(2);
      await waitFor(() => w.eval('typeof D !== "undefined" && D && D.w === 320'), { timeout: 20000 });
      const got = []; w.TlbxUI.download = (b, name) => got.push([b.type, name]);
      await engine(w, [call('add_text', { text: 'SALE', position: 'top', size: 40 }) + call('export', { format: 'png' }), 'Added SALE and exported a PNG.']);
      await waitFor(() => /exported a PNG/.test(text(w)), { timeout: 20000 });
      expect(got.length).toBe(1); expect(got[0][0]).toBe('image/png');
    }, { timeout: 240000 });
  });

  describe('Stop ends the whole chain', () => {
    it('a stopped chain does not continue on the next page', async () => {
      wipe();
      sessionStorage.setItem('tlbx-ai.handoff', JSON.stringify({ to: 'drive', toName: 'Files', fromName: 'Image Editor', task: 'slow task', line: 'Continuing in Files.', chain: { id: 'c-test', hop: 1 }, at: Date.now(), messages: [] }));
      const w = await open('drive/');
      await waitFor(() => w.TlbxAIPanel && w.TlbxAIPanel.isOpen, { timeout: 20000 }); await w.TlbxAIPanel.ready;
      const e = new w.TlbxAIKit.FakeEngine({ delay: 200, loadMs: 0, replies: ['a long answer that keeps going word after word after word'] }); await e.load('fake');
      w.TlbxAIPanel.use(e);
      await waitFor(() => w.document.querySelector('.sap-send.stop'));
      w.document.querySelector('.sap-send').click();
      await waitFor(() => /Stopped the task, in every app/.test(text(w)));
      expect(w.TlbxAIKit.handoff.cancelled('c-test')).toBe(true);
      w.TlbxAIKit.handoff.save({ to: 'imageeditor', task: 'next', chain: { id: 'c-test', hop: 2 } });
      expect(w.TlbxAIKit.handoff.peek('imageeditor')).toBe(null);
    }, { timeout: 60000 });
  });
  TlbxTest.run({ name: 'Assistant: a task through several apps' });
  </script>
</body>
</html>
