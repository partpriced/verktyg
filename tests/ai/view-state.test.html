<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Assistant saved place</title>
  <style>body { margin: 0; background: #111; } iframe { width: 1280px; height: 760px; border: 0; display: block; }</style>
</head>
<body>
  <iframe id="app" src="about:blank"></iframe>
  <script src="../harness.js"></script>
  <script>
  const { describe, it, expect, waitFor, sleep, run } = TlbxTest;
  const f = document.getElementById('app');
  /** Load a page in the iframe; for Assistant, wait until the app has booted (body.ready). */
  async function open(src) {
    const want = new URL(src, location.href).pathname, app = src.includes('/ai/');
    f.src = src;
    await waitFor(() => f.contentWindow && f.contentWindow.location.pathname === want && f.contentWindow.document.readyState === 'complete' && (!app || f.contentWindow.document.body.classList.contains('ready')), { timeout: 30000 });
    return f.contentWindow;
  }

  describe('Assistant saved place', () => {
    it('reopens the same chat with the unsent text after leaving for Files', async () => {
      await new Promise((res) => { const q = indexedDB.deleteDatabase('tlbx-session'); q.onsuccess = q.onerror = q.onblocked = () => res(); });
      let W = await open('../../ai/index.html');
      const c = W.AI.db.blank('chat');
      c.title = 'Place test';
      await W.AI.db.put(c);
      await W.AI.openConv(c.id);
      const input = W.AI.chat.input;
      input.value = 'an unsent thought';
      input.dispatchEvent(new W.Event('input', { bubbles: true }));
      await sleep(600);
      await open('../drive/frame.html');
      await sleep(60);
      W = await open('../../ai/index.html');
      await waitFor(() => W.AI.chat && W.AI.chat.conv && W.AI.chat.conv.id === c.id, { timeout: 10000 });
      expect(W.AI.chat.conv.id).toBe(c.id);
      expect(W.AI.chat.input.value).toBe('an unsent thought');
    }, { timeout: 90000 });
  });
  run({ name: 'Assistant · saved place' });
  </script>
</body>
</html>
