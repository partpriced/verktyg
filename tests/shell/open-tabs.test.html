<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Shell · TlbxOpenTabs and TlbxTabs live side by side</title>
</head>
<body>
  <script src="../harness.js"></script>
  <script src="../../shared/ui/tabs.js"></script>
  <script src="../../shell/tabs.js"></script>
  <script>
  // Covers: shell/tabs.js, shell/switcher.js, shell/shell.js
  // The view tab strip (TlbxTabs, shared/ui/tabs.js) and the list of open pages (TlbxOpenTabs, shell/tabs.js) had the same
  // global name, so whichever loaded second was lost: the app switcher's open tabs, or an app's tabs. They are two names now.
  const { describe, it, expect, run } = TlbxTest;
  describe('two globals, one page', () => {
    it('TlbxTabs is still the view tab strip', () => {
      expect(typeof window.TlbxTabs.mount).toBe('function');
    });
    it('TlbxOpenTabs lists the other open pages and has this page id', () => {
      expect(Array.isArray(window.TlbxOpenTabs.list())).toBe(true);
      expect(typeof window.TlbxOpenTabs.id).toBe('string');
      expect(typeof window.TlbxOpenTabs.focus).toBe('function');
    });
  });
  run();
  </script>
</body>
</html>
