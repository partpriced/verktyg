<body>
  <div class="df-bar" id="df-bar"></div>
  <main class="df-main" id="df-main">
    <section class="df-work" id="df-work" aria-label="Comparison">
      <div class="df-sides" id="df-sides">
        <section class="df-side" data-side="a" aria-labelledby="df-a-h">
          <div class="df-side-head">
            <h2 id="df-a-h"><span class="df-tag">A</span> Original</h2>
            <span class="df-name" id="df-a-name"></span>
            <span class="df-side-acts">
              <button type="button" class="sui-btn df-mini" data-act="open" data-side="a" aria-label="Open a file as A">Open…</button>
              <button type="button" class="sui-btn df-mini" data-act="drive" data-side="a" aria-label="Open A from Files">Files…</button>
              <button type="button" class="sui-btn df-mini" data-act="clear" data-side="a" aria-label="Clear A">Clear</button>
            </span>
          </div>
          <textarea class="df-text" id="df-a-text" spellcheck="false" aria-label="Text A" placeholder="Paste or type the original text, or drop a file here"></textarea>
          <div class="df-file" id="df-a-file" hidden></div>
        </section>
        <button type="button" class="sui-btn df-swap" id="df-swap" aria-label="Swap A and B" title="Swap A and B">⇄</button>
        <section class="df-side" data-side="b" aria-labelledby="df-b-h">
          <div class="df-side-head">
            <h2 id="df-b-h"><span class="df-tag">B</span> Changed</h2>
            <span class="df-name" id="df-b-name"></span>
            <span class="df-side-acts">
              <button type="button" class="sui-btn df-mini" data-act="open" data-side="b" aria-label="Open a file as B">Open…</button>
              <button type="button" class="sui-btn df-mini" data-act="drive" data-side="b" aria-label="Open B from Files">Files…</button>
              <button type="button" class="sui-btn df-mini" data-act="clear" data-side="b" aria-label="Clear B">Clear</button>
            </span>
          </div>
          <textarea class="df-text" id="df-b-text" spellcheck="false" aria-label="Text B" placeholder="Paste or type the changed text, or drop a file here"></textarea>
          <div class="df-file" id="df-b-file" hidden></div>
        </section>
      </div>
      <div class="df-res" id="df-res" hidden>
        <div class="df-res-bar">
          <p class="df-sum" id="df-sum" role="status" aria-live="polite"></p>
          <span class="df-nav">
            <button type="button" class="sui-btn df-mini" id="df-prev" aria-label="Previous change">↑ Previous</button>
            <span class="df-pos" id="df-pos"></span>
            <button type="button" class="sui-btn df-mini" id="df-next" aria-label="Next change">Next ↓</button>
          </span>
        </div>
        <div class="df-out" id="df-out"></div>
      </div>
      <p class="df-err" id="df-err" role="alert" hidden></p>
      <div class="df-drop" id="df-drop"></div>
    </section>
    <aside class="df-panel" id="df-panel" aria-label="Compare settings"></aside>
  </main>
  <div hidden><div class="df-settings" id="df-settings"></div></div>
