<body>
  <div class="smb-hold" hidden>
    <span class="local-badge" title="Your photos are sorted in this browser. Nothing is uploaded or kept after you close the page." data-i18n-attr="title:sorter.app.local_tip"><span data-i18n="sorter.app.local">100% local</span></span>
  </div>
  <main class="so-app">
    <section class="so-intro">
      <h1 data-i18n="sorter.app.title">Sort photos: keep the best</h1>
      <p class="so-lede" data-i18n="sorter.app.lede">Drop a pile of photos or a whole folder, then swipe through them one at a time: like, dislike or tag each one with the arrow keys or the buttons. Download the keepers as a ZIP, or put them in Files.</p>
    </section>
    <!-- View · Panel (shared/frame): the photos; Start sorting and the downloads in the panel on the right -->
    <div class="so-frame" id="soFrame">
    <div class="so-view" id="soView">
    <div class="so-add">
      <div id="soDrop" class="so-drop"></div>
      <div class="so-or"><button type="button" class="so-btn" id="soFolder" data-i18n="sorter.app.folder">Choose a folder…</button>
</div>
    </div>
    <p id="soMsg" class="so-msg" role="status" aria-live="polite"></p>
    <section id="soWork" class="so-work" hidden aria-label="Your photos" data-i18n-attr="aria-label:sorter.app.your_photos">
      <div class="so-bar">
        <div id="soFilters" class="so-filters" role="group" aria-label="Show" data-i18n-attr="aria-label:sorter.app.show"></div>
      </div>
      <ul id="soGrid" class="so-grid" aria-label="Photos" data-i18n-attr="aria-label:sorter.app.photos"></ul>
      <p id="soNone" class="so-none" hidden data-i18n="sorter.app.none">No photos in this view.</p>
    </section>
    </div>
    <aside class="so-side" id="soSide" aria-label="Sort and save" data-i18n-attr="aria-label:sorter.app.side">
      <button type="button" class="so-btn" id="soZip" data-i18n="sorter.app.zip">Download liked (ZIP)</button>
      <button type="button" class="so-btn" id="soDrive" data-i18n="sorter.app.drive">Save liked to Files</button>
      <button type="button" class="so-btn" id="soCsv" data-i18n="sorter.app.csv">Download the list (CSV)</button>
      <button type="button" class="so-btn" id="soClear" data-i18n="sorter.app.clear">Clear</button>
      <button type="button" class="so-btn primary" id="soStart">Start sorting</button>
    </aside>
    </div>
