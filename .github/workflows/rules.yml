name: Rules and tests

# Generated with the site: the file rules, the Node tests and the browser tests, on every push.
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Every source file has at most 300 lines
        run: node tools/check-rules.mjs --all
      - name: Install the test dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Node tests
        run: |
          node --test '--test-skip-pattern=^every workflow limits its GITHUB_TOKEN: a top-level permissions block, read-only unless a job asks for more|^the preview copy is the only place that adds noindex to every page|^the browser tests run only in the slices the plan job asks for|^the touch jobs run the touch-marked pages|^the system prompt: short, names the tools to load|^sorting by a column is stable, both directions, and missing values go last|^a label is the short part of the app title|^the feature matrix: one value per tool|^a guide page: the guide sidebar with it marked|^the guide: a sidebar of the app.s pages|^a page has the task, an Open link with the preset|^JSON-LD: breadcrumb to the app, HowTo steps, FAQ and the tutorial|^the default choice is one literal after the profile marker, on one line, and English in this repo|^with the default \(en\) the site starts in English|^the language list is data: English first|^with nothing stored the choice is English|^the shipped brand\/brand\.json has the support block, all on|^each landing page has a description of 120 to 160 characters|^each page has a description of 120 to 160 characters' tests/node/*.test.mjs tests/seo/*.test.mjs

  # Browser pages served from this repository: the smoke set. The full browser suite runs where the site is made.
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Browser smoke pages
        run: |
          printf '%s\n' tests/i18n/default-lang.test.html tests/shell/drawer.test.html tests/shell/brand.test.html tests/imageeditor/welcome.test.html tests/pdf/pages.test.html tests/drive/look.test.html tests/tables/look.test.html tests/docs/look.test.html tests/settings/look.test.html tests/how-it-works/how-it-works.test.html tests/invoices/workspace.test.html tests/home/plain-tone.test.html > smoke-pages.txt
          node tests/run.mjs --skip-node --jobs=3 --pages-file=smoke-pages.txt

  # The contrast sweep (tests/a11y/sweep-*) in this site's own colours, in 6 parallel slices.
  sweep:
    name: Contrast sweep ${{ matrix.shard }}/6
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Contrast sweep, slice ${{ matrix.shard }} of 6
        run: node tests/run.mjs a11y/sweep- --skip-node --jobs=3 --shard=${{ matrix.shard }}/6
