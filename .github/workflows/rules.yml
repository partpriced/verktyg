name: Rules and tests

# Generated with the site: the file rules, the Node tests and the browser tests, on every push.
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Every source file has at most 300 lines
        run: node tools/check-rules.mjs --all
      - name: Install the test dependencies
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Node tests
        run: node --test tests/node/*.test.mjs tests/seo/*.test.mjs

  # The browser tests (every tests/**/*.test.html), split into 8 slices that run as parallel jobs, 3 pages at a time in each.
  # The slices are balanced by tests/timings.json (refresh with: node tests/run.mjs --record-timings).
  browser:
    name: Browser tests ${{ matrix.shard }}/8
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium and its system libraries
        run: npx playwright install --with-deps chromium
      - name: Browser tests, slice ${{ matrix.shard }} of 8
        run: node tests/run.mjs --shard=${{ matrix.shard }}/8 --jobs=3 --skip-node
